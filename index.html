    <p>
      「家計簿のログ」は、利用者が自分の Google スプレッドシートで家計簿をつけるための
      Google Apps Script です。個人と家族での利用だけを目的としており、一般には提供していません。
    </p>

    <h2>できること</h2>
    <ul>
      <li>利用者の家計簿スプレッドシートに、支出や収入を記録する</li>
      <li>利用者の Google ドライブの決められたフォルダに置かれたレシートの画像を読み取り、家計簿に登録する</li>
      <li>月ごとのシートを作るなど、家計簿の定型作業を自動で行う</li>
    </ul>
